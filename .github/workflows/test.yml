        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: examples/practical-app

      - name: Install Chrome for Cuprite
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vite-plugin-opal
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/practical-app

      - name: Run E2E tests (Capybara + Cuprite)
        run: |
          pnpm dev &
          sleep 10
          bash "$GITHUB_WORKSPACE/.github/scripts/rspec-e2e.sh"
        working-directory: examples/practical-app
        env:
          CI: true

