          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install

      - name: Build vite-plugin-opal
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/stimulus-components-app

      - name: Run E2E tests (Capybara + Cuprite)
        run: |
          pnpm dev &
          sleep 10
          bundle exec rspec
        working-directory: examples/stimulus-components-app
        env:
          CI: true

  build-examples:
    name: Build All Examples
    runs-on: ubuntu-latest

    strategy:
      matrix:
        example:
          - stimulus-app
          - stimulus-components-app
          - practical-app
          - chart-app
          - chat-app
          - api-example
          - vue-app
          - i18n-app
          - pwa-app
          - react-app
          - form-validation-app
          - snabberb-app
          - tabs-app
          - counter-app
          - crud-app
          - turbo-app
          - utilities-app
          - debug-app

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: examples/${{ matrix.example }}

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vite-plugin-opal
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/${{ matrix.example }}

      - name: Build
        run: pnpm build
        working-directory: examples/${{ matrix.example }}

      - name: Check build output
        run: |
          ls -lah dist/
          test -f dist/index.html
        working-directory: examples/${{ matrix.example }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.example }}
          path: examples/${{ matrix.example }}/dist
          retention-days: 7
