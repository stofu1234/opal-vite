          working-directory: examples/stimulus-components-app

      - name: Install Chrome for Cuprite
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install

      - name: Build vite-plugin-opal
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/stimulus-components-app

      - name: Run E2E tests (Capybara + Cuprite)
        run: |
          pnpm dev &
          sleep 10
          bash "$GITHUB_WORKSPACE/.github/scripts/rspec-e2e.sh"
        working-directory: examples/stimulus-components-app
        env:
          CI: true

  build-examples:
    name: Build All Examples
    runs-on: ubuntu-latest

    strategy:
      matrix:
        example:
          - stimulus-app
          - stimulus-components-app
          - practical-app
          - chart-app
          - chat-app
          - api-example
          - vue-app
          - i18n-app
          - pwa-app
          - react-app
          - form-validation-app
          - snabberb-app
          - tabs-app
          - counter-app
          - crud-app
          - turbo-app
          - utilities-app
          - debug-app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: examples/${{ matrix.example }}

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vite-plugin-opal
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Install example dependencies
        run: bundle install
        working-directory: examples/${{ matrix.example }}

      - name: Build
        run: pnpm build
        working-directory: examples/${{ matrix.example }}

      - name: Check build output
        run: |
          ls -lah dist/
          test -f dist/index.html
        working-directory: examples/${{ matrix.example }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.example }}
          path: examples/${{ matrix.example }}/dist
          retention-days: 7
