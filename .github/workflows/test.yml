name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-plugin:
    name: Test Vite Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: gems/opal-vite

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin tests
        run: pnpm test
        working-directory: packages/vite-plugin-opal

      - name: Run gem specs
        run: bundle exec rspec
        working-directory: gems/opal-vite

  # peerDependencies allow vite >=5 <9, but the lockfile pins one vite series.
  # Re-run the plugin tests against each other series by overriding vite in
  # the job only (package.json / pnpm-lock.yaml in the checkout are not
  # committed back).
  test-plugin-vite-matrix:
    name: Test Vite Plugin (vite ${{ matrix.vite }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        vite: ['6', '7', '8']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: gems/opal-vite

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Override vite with ${{ matrix.vite }}.x
        run: |
          pnpm add -D "vite@^${{ matrix.vite }}"
          pnpm exec vite --version
        working-directory: packages/vite-plugin-opal

      - name: Run plugin tests
        run: pnpm exec vitest run
        working-directory: packages/vite-plugin-opal

  test-practical-app:
