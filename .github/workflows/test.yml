name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-plugin:
    name: Test Vite Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: gems/opal-vite

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin tests
        run: pnpm test
        working-directory: packages/vite-plugin-opal

      - name: Run gem specs
        run: bundle exec rspec
        working-directory: gems/opal-vite

  # peerDependencies allow vite >=5 <9, but the lockfile pins one vite series.
  # Re-run the plugin tests against each other series by overriding vite in
  # the job only (package.json / pnpm-lock.yaml in the checkout are not
  # committed back).
  test-plugin-vite-matrix:
    name: Test Vite Plugin (vite ${{ matrix.vite }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        vite: ['5', '6', '7', '8']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: gems/opal-vite

      - name: Build and install opal-vite gem
        run: |
          cd gems/opal-vite
          bundle install
          gem build opal-vite.gemspec
          gem install opal-vite-*.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vitest 4 requires vite 6+ (it imports vite/module-runner), so vite 5
      # runs the same tests with vitest 3.
      - name: Override vite with ${{ matrix.vite }}.x
        run: |
          if [ "${{ matrix.vite }}" = "5" ]; then
            pnpm add -D "vite@^5" "vitest@^3"
          else
            pnpm add -D "vite@^${{ matrix.vite }}"
          fi
          pnpm exec vite --version
        working-directory: packages/vite-plugin-opal

      - name: Run plugin tests
        run: pnpm exec vitest run
        working-directory: packages/vite-plugin-opal

  test-practical-app:
