name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # The repository's default GITHUB_TOKEN is read-only; creating a GitHub
    # Release needs write access to contents.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for changelog

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'

      - name: Install opal and opal-vite gems
        run: |
          gem install opal -v '~> 1.8'
          cd gems/opal-vite && gem build opal-vite.gemspec && gem install *.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Run tests
        run: pnpm test
        working-directory: packages/vite-plugin-opal

      # Commented out: Manual publish preferred
      # - name: Publish to npm
      #   if: startsWith(github.ref, 'refs/tags/')
      #   run: pnpm publish --no-git-checks
      #   working-directory: packages/vite-plugin-opal
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Use the previous tag as the start of the range; for the very first
          # tag there is none, so fall back to the whole history.
          if PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null); then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          # Random delimiter so a commit subject can't terminate the value early
          DELIMITER="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "CHANGELOG<<$DELIMITER"
            echo "$CHANGELOG"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Changes in this release

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ```bash
            pnpm add -D vite-plugin-opal@${{ steps.version.outputs.VERSION }}
            ```

            ## Documentation

            See the [README](https://github.com/${{ github.repository }}/blob/master/README.md) for full documentation.

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

