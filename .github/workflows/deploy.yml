name: Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

# Read-only by default. Only the deploy job, which runs no project code or
# dependency scripts, gets write access to push to gh-pages.
permissions:
  contents: read

# Don't let overlapping runs race each other pushing to gh-pages
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation & Playground
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Keep the token out of .git/config while dependency scripts run
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install opal and opal-vite gems
        run: |
          gem install opal
          cd gems/opal-vite && gem build opal-vite.gemspec && gem install *.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vite-plugin-opal
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Build VitePress documentation
        run: pnpm docs:build

      - name: Build examples for playground
        run: |
          EXAMPLES="practical-app chart-app stimulus-app api-example form-validation-app i18n-app pwa-app turbo-app vue-app react-app snabberb-app counter-app crud-app tabs-app utilities-app debug-app stimulus-components-app component-base-app"
          for app in $EXAMPLES; do
            echo "Building $app..."
            cd examples/$app
            bundle install || true  # Some apps may not have Gemfile
            # Set base path for GitHub Pages subdirectory
            VITE_BASE=/opal-vite/playground/$app/ pnpm build
            cd ../..
          done

      - name: Copy examples to playground directory
        run: |
          mkdir -p docs/.vitepress/dist/playground
          EXAMPLES="practical-app chart-app stimulus-app api-example form-validation-app i18n-app pwa-app turbo-app vue-app react-app snabberb-app counter-app crud-app tabs-app utilities-app debug-app stimulus-components-app component-base-app"
          for app in $EXAMPLES; do
            cp -r examples/$app/dist docs/.vitepress/dist/playground/$app
          done

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
