name: Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

# Read-only by default. Only the deploy job, which runs no project code or
# dependency scripts, gets write access to push to gh-pages.
permissions:
  contents: read

# Don't let overlapping runs race each other pushing to gh-pages
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation & Playground
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the token out of .git/config while dependency scripts run
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.2'

      - name: Install opal and opal-vite gems
        run: |
          gem install opal -v '~> 1.8'
          cd gems/opal-vite && gem build opal-vite.gemspec && gem install *.gem

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vite-plugin-opal
        run: pnpm build
        working-directory: packages/vite-plugin-opal

      - name: Build VitePress documentation
        run: pnpm docs:build

      - name: Build examples for playground
        run: |
          EXAMPLES="practical-app chart-app stimulus-app api-example form-validation-app i18n-app pwa-app turbo-app vue-app react-app snabberb-app counter-app crud-app tabs-app utilities-app debug-app stimulus-components-app component-base-app"
          for app in $EXAMPLES; do
            echo "Building $app..."
            cd examples/$app
            bundle install
            # Set base path for GitHub Pages subdirectory
            VITE_BASE=/opal-vite/playground/$app/ pnpm build
            cd ../..
          done

      - name: Copy examples to playground directory
        run: |
          mkdir -p docs/.vitepress/dist/playground
          EXAMPLES="practical-app chart-app stimulus-app api-example form-validation-app i18n-app pwa-app turbo-app vue-app react-app snabberb-app counter-app crud-app tabs-app utilities-app debug-app stimulus-components-app component-base-app"
          for app in $EXAMPLES; do
            cp -r examples/$app/dist docs/.vitepress/dist/playground/$app
          done

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: docs/.vitepress/dist
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
